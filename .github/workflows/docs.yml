# Generated by the connector's source repository; edits here are replaced
# on the next release.
name: docs
on:
  push:
    branches:
      - main
    tags:
      - "docs-*"
    paths:
      - "docs/**"
  pull_request: {}
permissions: {}
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGES_REPO_NWO: "${{ github.repository }}"
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Write a Gemfile for the theme docs/ pins"
        run: |
          set -euo pipefail
          theme="$(sed -n 's|^remote_theme: *modootoday/jekyll-theme-modootoday@v\([0-9][0-9.]*\) *$|\1|p' docs/_config.yml)"
          if [ -z "$theme" ]; then echo "docs/_config.yml pins no theme tag" >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/docs-check"
          {
            echo 'source "https://rubygems.org"'
            echo 'gem "github-pages", "232", group: :jekyll_plugins'
            echo 'gem "jekyll-include-cache", "0.2.1", group: :jekyll_plugins'
            echo 'gem "jekyll-octicons", "~> 14.2", group: :jekyll_plugins'
            echo 'gem "nokogiri", "1.16.7"'
            echo 'gem "webrick"'
            echo "gem \"jekyll-theme-modootoday\", \"$theme\""
          } > "$RUNNER_TEMP/docs-check/Gemfile"
          echo "BUNDLE_GEMFILE=$RUNNER_TEMP/docs-check/Gemfile" >> "$GITHUB_ENV"
      - name: "Set up Ruby"
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3.4"
      - name: Install
        run: "bundle install --jobs 4"
      - name: "Build docs/"
        run: "bundle exec jekyll build --source docs --destination \"$RUNNER_TEMP/site\""
      - name: "Check docs/"
        run: "bundle exec modootoday-check docs \"$RUNNER_TEMP/site\" --links"
