# Generated by the connector's source repository; edits here are replaced
# on the next release.
name: release
on:
  push:
    tags:
      - "v*"
permissions: {}
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Set up Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: "Install npm"
        run: "npm install -g npm@11.21.2"
      - name: Install
        run: "npm install --no-audit --no-fund --ignore-scripts"
      - name: Build
        run: "npm run build"
      - name: Typecheck
        run: "npm run typecheck --workspaces"
      - name: Test
        run: "npm test"
      - name: "Check that the manifests agree"
        run: "node scripts/check-manifests.mjs \"${GITHUB_REF_NAME}\""
      - name: "Install cosign"
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: "Install mcp-publisher"
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$archive" -C "$RUNNER_TEMP/bin" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: "Pack the npm tarball"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp publish/package.json mcp/package.json
          (cd mcp && npm pack --pack-destination "$RUNNER_TEMP/out")
          cp server.json "$RUNNER_TEMP/out/server.json"
      - name: "Pack the .mcpb bundle"
        run: |
          set -euo pipefail
          name="$(node -p "require('./mcpb/manifest.json').name")"
          version="$(node -p "require('./mcpb/manifest.json').version")"
          bundle="$RUNNER_TEMP/mcpb"
          mkdir -p "$bundle/server"
          cp mcpb/manifest.json "$bundle/manifest.json"
          cp README.md "$bundle/README.md"
          cp mcp/LICENSE "$bundle/LICENSE"
          cp publish/package.json "$bundle/server/package.json"
          cp -R mcp/dist "$bundle/server/dist"
          (cd "$bundle/server" && npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock)
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$bundle/manifest.json"
          npx --yes @anthropic-ai/mcpb@2.1.2 pack "$bundle" "$RUNNER_TEMP/out/$name-$version.mcpb"
      - name: "Validate server.json"
        run: "mcp-publisher validate \"$RUNNER_TEMP/out/server.json\""
      - name: "Upload the packaged files"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: "${{ runner.temp }}/out"
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Set up Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: "Install npm"
        run: "npm install -g npm@11.21.2"
      - name: "Download the packaged files"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: "${{ runner.temp }}/release"
      - name: "Publish to npm"
        working-directory: "${{ runner.temp }}/release"
        run: |
          set -euo pipefail
          name="$(node -p "require('./server.json').packages[0].identifier")"
          version="$(node -p "require('./server.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          npm publish ./*.tgz --provenance --access public
      - name: "Wait until npm serves the version"
        working-directory: "${{ runner.temp }}/release"
        run: |
          set -euo pipefail
          name="$(node -p "require('./server.json').packages[0].identifier")"
          version="$(node -p "require('./server.json').version")"
          server="$(node -p "require('./server.json').name")"
          for _ in $(seq 60); do
            if [ "$(npm view "$name@$version" mcpName 2> /dev/null)" = "$server" ]; then exit 0; fi
            sleep 10
          done
          echo "$name@$version is not served with mcpName $server after 10 minutes" >&2
          exit 1
      - name: "Install cosign"
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: "Install mcp-publisher"
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$archive" -C "$RUNNER_TEMP/bin" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: "Publish to the MCP Registry"
        working-directory: "${{ runner.temp }}/release"
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
  release:
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download the packaged files"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: "${{ runner.temp }}/release"
      - name: "Attach the .mcpb to the GitHub Release"
        working-directory: "${{ runner.temp }}/release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.mcpb --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" ./*.mcpb --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "Install in Claude Desktop by opening the .mcpb file."
          fi
