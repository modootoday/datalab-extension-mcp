# The privacy promises, shown on the start page and on the privacy page.
lead: "연결 프로그램은 내 컴퓨터 안의 다리예요. AI 앱과 내 브라우저 사이만 이어요."
cards:
  - title: "내 컴퓨터 안에서만 연결돼요"
    text: "다른 컴퓨터나 웹페이지는 닿지 못하고, 연결 프로그램은 컴퓨터 밖으로 아무것도 보내지 않아요."
  - title: "AI 앱마다 직접 허용해요"
    text: "허용한 앱 목록은 사이드패널에서 보고 취소할 수 있어요."
  - title: "아이디·비밀번호를 저장하지 않아요"
    text: "모든 조회는 내가 로그인해 둔 내 브라우저 안에서 일어나요."
  - title: "AI 앱은 어느 브라우저인지 알 수 있어요"
    text: "프로필이 여러 개면 고를 수 있게 브라우저 이름, 프로필 이름, 로그인한 네이버 블로그 아이디를 허용한 AI 앱에 알려줘요. AI 앱에 간 내용은 그 앱의 AI 서비스로 전달될 수 있어요."
