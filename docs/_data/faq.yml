# Questions shown on the start page and on the FAQ page. An answer is HTML; a link names a site path.
items:
  - q: "유료인가요?"
    a: "연결 프로그램은 무료이고 소스가 공개된 오픈소스예요. AI 이미지 만들기처럼 청구가 생기는 기능은 실행 전에 매번 물어봐요."
  - q: "ChatGPT나 Claude 웹사이트에서도 되나요?"
    a: "아직은 컴퓨터에 설치한 AI 앱만 연결돼요. ChatGPT는 데스크톱 앱에서 쓸 수 있어요."
  - q: "Node.js를 설치해야 하나요?"
    a: "네, Node.js 22 이상이 필요해요. 명령어로 설치하든 AI에게 맡기든 같아요. AI에게 맡기면 버전을 먼저 확인하고, 없으면 설치 방법을 알려 줘요."
  - q: "예전에 설치 인증키로 설치했어요. 다시 해야 하나요?"
    a: '아니요. 지금 설정 그대로 계속 동작해요. 새 방법으로 바꾸고 싶을 때만 다시 설치하면 돼요. <a href="/guides/">옮기는 방법</a>은 가이드에 있어요.'
  - q: "완전히 지우려면 어떻게 하나요?"
    a: "AI 앱에서 연결 프로그램을 제거하고, 확장 프로그램 설정에서 MCP 연결을 꺼요. 연결을 꺼 두면 설정이 남아 있어도 AI 앱은 아무것도 조회할 수 없어요."
