    <div class="dl-actions"><a class="dl-btn dl-btn-primary dl-btn-sm" href="{{ site.datalab.ask }}&amp;title={{ '[' | append: include.tool.name | append: '] ' | url_encode }}">질문과 답에 물어보기</a><a class="dl-btn dl-btn-sm" href="{{ site.datalab.discussions }}?discussions_q={{ include.tool.name | url_encode }}">이 도구의 다른 질문 보기</a></div>
